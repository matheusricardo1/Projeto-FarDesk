name: FarDesk Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
            $tag = "v$version"
          } else {
            $version = "${{ github.ref_name }}".TrimStart("v")
            $tag = "${{ github.ref_name }}"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: native/tailscale/go.sum

      - name: Prepare FFmpeg
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip" `
            -OutFile $archive
          $extract = "$env:RUNNER_TEMP\ffmpeg"
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $root = Get-ChildItem $extract -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path ".tools\ffmpeg" | Out-Null
          Copy-Item "$($root.FullName)\include" ".tools\ffmpeg" -Recurse -Force
          Copy-Item "$($root.FullName)\lib" ".tools\ffmpeg" -Recurse -Force
          Copy-Item "$($root.FullName)\bin" ".tools\ffmpeg" -Recurse -Force

      - name: Prepare OpenSSL with vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" install openssl:x64-windows --x-install-root="$((Get-Location).Path)\.tools\vcpkg-installed"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg OpenSSL installation failed." }

      - name: Install Flutter dependencies
        working-directory: app_desktop
        run: flutter pub get

      - name: Build and package release
        shell: pwsh
        run: |
          .\scripts\build-windows-production.ps1 `
            -Version "${{ steps.version.outputs.version }}" `
            -BuildNumber "${{ github.run_number }}" `
            -BackendBaseUrl "https://fardesk-api.vercel.app"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: FarDesk ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            build/installer/FarDesk-Setup.exe
            app_desktop/build/windows/x64/runner/Release/FarDesk.exe
